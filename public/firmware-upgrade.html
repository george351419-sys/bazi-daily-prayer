<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>画屏固件升级</title><style>body{font:17px/1.7 system-ui;max-width:760px;margin:35px auto;padding:20px;color:#183329;background:#f5f5ef}button{font:inherit;padding:13px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:12px}.ok{color:#08713e}.bad{color:#b12a28}label{display:block;margin:12px 0}input:not([type=checkbox]){display:block;box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aabbb0;border-radius:6px;background:white}button:disabled{opacity:.5}form{border-block:1px solid #aabbb0;padding:16px 0;margin:20px 0}</style><h1>画屏固件升级</h1><p>目标：3.2.5-ritual.8。固件通过 HTTPS 下载并校验，再通过蓝牙升级和核验；适配指定构建的出厂版 3.2.5，以及 ritual.3 / ritual.5 / ritual.6。请保持画屏供电，并退出手机小程序的蓝牙连接。先选择蓝牙设备，再点击第 3 步升级；Wi-Fi 配网可选。蓝牙名称在系统弹窗中选择，无需输入蓝牙密码。</p><button id="connect">1. 选择并连接蓝牙设备</button><button id="rescan">重新选择蓝牙设备</button><button id="read" disabled>读取运行版本</button><form id="wifi"><h2>2. 设置画屏 Wi-Fi</h2><p>请输入画屏附近的 2.4 GHz 网络。此步用于后续画作同步，可跳过并直接升级。</p><label>Wi-Fi 名称<input id="ssid" name="ssid" required maxlength="32" autocomplete="off" placeholder="输入 2.4 GHz Wi-Fi 名称"></label><label>Wi-Fi 密码<input id="password" name="password" type="password" required minlength="8" maxlength="63" autocomplete="off" placeholder="输入 Wi-Fi 密码"></label><label><input id="show-password" type="checkbox">显示密码</label><button id="configure" type="submit" disabled>写入并连接 Wi-Fi</button><p>密码仅通过蓝牙传给画屏，不上传服务器；提交结束后清空。</p></form><button id="upgrade" disabled>3. 通过蓝牙升级并核验</button><pre id="state" role="status" aria-live="polite">等待连接。</pre><pre id="detail">升级后需版本与编译指纹同时匹配，才显示成功。</pre><script type="module">
import {ArkNetwork} from './ark-network.js?v=20261109-transfer-complete-v1';
const state=document.querySelector('#state'),detail=document.querySelector('#detail'),upgrade=document.querySelector('#upgrade'),readButton=document.querySelector('#read');
const wifiForm=document.querySelector('#wifi'),ssid=document.querySelector('#ssid'),password=document.querySelector('#password'),configure=document.querySelector('#configure');
const refreshControls=()=>{const disabled=busy||connecting||!client.characteristic;configure.disabled=disabled;readButton.disabled=disabled;upgrade.disabled=disabled;ssid.disabled=busy;password.disabled=busy;};
const expected=await fetch('./firmware/ritual-8.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('固件清单不可用');return r.json();});
let chosen,busy=false,lastInfo,forcePicker=false,connecting=false;
const bluetooth={requestDevice:async options=>{
 if(chosen&&!forcePicker)return chosen;
 if(forcePicker){forcePicker=false;chosen=await navigator.bluetooth.requestDevice(options);return chosen;}
 const known=typeof navigator.bluetooth.getDevices==='function'?await navigator.bluetooth.getDevices():[];
 const same=known.filter(d=>String(d.name||'').startsWith('FRAMEFILMARK-'));
 chosen=same.length===1?same[0]:await navigator.bluetooth.requestDevice(options);return chosen;
}};
const client=new ArkNetwork({bluetooth,onState:s=>{if(!busy)state.textContent=s.paired?'蓝牙已连接：'+client.device.name+'。可直接点击第 3 步蓝牙升级；需要配网时请填写本页 Wi-Fi 名称和密码。':s.text;refreshControls();},onOta:s=>{state.textContent=(s.transport==='ble'?'蓝牙固件传输：':'Wi-Fi 下载与校验：')+s.progress+'% · '+s.received+'/'+s.total+' 字节。请保持画屏供电和页面开启，传输后还需重启核验。';}});
refreshControls();
const matches=info=>info.version===expected.version&&info.sha===expected.elfSha256;
async function read(){lastInfo=await client.readBuildInfo();detail.textContent='设备：'+client.device.name+'\n运行版本：'+lastInfo.version+'\n升级容量：'+lastInfo.otaMax+' 字节\n设备项目：'+lastInfo.project+'\n编译指纹：'+lastInfo.sha+'\n目标指纹：'+expected.elfSha256;return lastInfo;}
async function connect(){if(!navigator.bluetooth)throw Error('浏览器不支持 Web Bluetooth，请使用电脑 Chrome');await client.connect();await read();}
async function connectDevice(force=false){
 if(busy||connecting)return;connecting=true;document.querySelector('#connect').disabled=true;document.querySelector('#rescan').disabled=true;
 if(force){client.disconnect();chosen=null;forcePicker=true;}
 try{
  for(let attempt=0;attempt<20;attempt++){
   try{await connect();state.textContent='蓝牙已连接：'+client.device.name+'。请填写下方 Wi-Fi 名称和密码，或直接点击第 3 步通过蓝牙升级。';return;}
   catch(e){
    if(/cancel|NotFoundError|拒绝|取消/i.test(e.message)||attempt===19)throw e;
    client.disconnect();state.textContent='等待画屏唤醒并连接（'+(attempt+1)+'/20）…请按 Home 唤醒，连接成功后请设置 Wi-Fi。';
    await new Promise(r=>setTimeout(r,3000));
   }
  }
 }catch(e){state.textContent='尚未开始升级：'+e.message;}
 finally{connecting=false;if(!busy){document.querySelector('#connect').disabled=false;document.querySelector('#rescan').disabled=false;}refreshControls();}
}
document.querySelector('#connect').onclick=()=>connectDevice(false);
document.querySelector('#rescan').onclick=()=>connectDevice(true);
document.querySelector('#show-password').onchange=event=>{password.type=event.target.checked?'text':'password';};
wifiForm.onsubmit=async event=>{
 event.preventDefault();if(busy||connecting||!client.characteristic)return;
 busy=true;refreshControls();document.querySelector('#connect').disabled=true;document.querySelector('#rescan').disabled=true;state.className='';state.textContent='正在通过蓝牙写入 Wi-Fi 并等待画屏联网确认…';
 try{await client.configure(ssid.value,password.value);state.className='ok';state.textContent='画屏已确认连接 Wi-Fi。现在可点击「3. 通过蓝牙升级并核验」。';}
 catch(e){state.className='bad';state.textContent='Wi-Fi 配网未完成：'+e.message;}
 finally{password.value='';password.type='password';document.querySelector('#show-password').checked=false;busy=false;refreshControls();document.querySelector('#connect').disabled=false;document.querySelector('#rescan').disabled=false;}
};
window.addEventListener('pagehide',()=>{password.value='';client.disconnect();});
readButton.onclick=async()=>{try{const info=await read();state.textContent=matches(info)?'已确认：当前运行 '+expected.version+'，编译指纹一致。':'当前运行固件尚未匹配目标。';}catch(e){state.textContent=e.message;}};
upgrade.onclick=async()=>{
 if(busy||connecting||!client.characteristic)return;
 busy=true;refreshControls();document.querySelector('#rescan').disabled=true;upgrade.disabled=true;readButton.disabled=true;document.querySelector('#connect').disabled=true;state.className='';
 try{
  const before=await read();
  if(matches(before)){state.className='ok';state.textContent='已确认：当前已运行目标固件，无须重复升级。';return;}
  if(!String(client.device.name||'').startsWith('FRAMEFILMARK-'))throw Error('请选择 FrameFilm Ark 画屏');
  if(![['3.2.5','de9eb5af62fe38e54fa90a15472bb49f4dbbaac35a59f1d0321a536885041469'],['3.2.5-ritual.3','f6aff2f33116c98fbdcc5a12b00bca057776f6a33b32821995f4e65497b57f92'],['3.2.5-ritual.5','59972da4d66db28b4d2d60929026e0304e1599e9408e65db8678b1a23aa2b69b'],['3.2.5-ritual.6','e22776bd34de9bb23da9a8f8c942ede949cbdefa1e9eeac507bd80d0eec8fb1c']].some(([version,sha])=>before.version===version&&before.sha===sha))throw Error('当前固件与已确认的升级起点不同，请重新核对');
  if(before.project!=='frame_film_ark'||!before.otaMax||expected.bytes>before.otaMax)throw Error('升级包与设备项目或容量不匹配：文件 '+expected.bytes+' 字节，设备容量 '+before.otaMax+' 字节。');
  chosen=client.device;state.textContent='正在通过 HTTPS 获取并校验固件，再通过蓝牙传入画屏。请保持供电、页面开启和蓝牙连接，预计需要数分钟。';
  const response=await fetch('./firmware/'+expected.file,{cache:'no-store'});if(!response.ok)throw Error('固件文件下载失败');
  const image=new Uint8Array(await response.arrayBuffer());if(image.length!==expected.bytes)throw Error('固件长度与清单不一致，未写入画屏。');
  await client.startBleOta(image,expected.sha256);
  state.textContent='固件已校验并申请切换，等待重启后读取运行指纹…';
  await new Promise(r=>setTimeout(r,10000));client.disconnect();
  let lastError;
  for(let i=0;i<12;i++){
   try{await client.connect();const info=await read();if(matches(info)){state.className='ok';state.textContent='升级成功并已核验：当前运行 '+expected.version+'，编译指纹完全一致。';return;}lastError=Error('设备仍返回 '+info.version);client.disconnect();}
   catch(e){lastError=e;client.disconnect();}
   state.textContent='正在等待重启并重新核验（'+(i+1)+'/12）…';await new Promise(r=>setTimeout(r,3000));
  }
  throw Error('尚未确认新固件启动：'+lastError.message+'。请唤醒画屏后点击连接并读取版本。');
 }catch(e){state.className='bad';state.textContent='尚未确认升级成功：'+e.message;}
 finally{busy=false;document.querySelector('#rescan').disabled=false;document.querySelector('#connect').disabled=false;readButton.disabled=!client.characteristic;upgrade.disabled=!client.characteristic;refreshControls();}
};
</script></html>
